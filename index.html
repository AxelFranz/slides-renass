<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

	<title>reveal.js</title>

	<link rel="stylesheet" href="dist/reset.css">
	<link rel="stylesheet" href="dist/reveal.css">
	<link rel="stylesheet" href="dist/theme/black.css">

	<!-- Theme used for syntax highlighted code -->
	<link rel="stylesheet" href="plugin/highlight/monokai.css">
</head>

<body>
	<div class="reveal">
		<div class="slides">
			<section>
				<h1>Demo Presentation</h1>
			</section>

			<section>
				<h2>Tech stack summary</h2>
				<ul>
					<li class="fragment">Frontend : HTMX + Templ</li>
					<li class="fragment">Backend : Go + Redis</li>
				</ul>
			</section>
			<section>
				<p>This will remain visible for all vertical slides</p>
				<section>Here is some vertical content</section>
				<section>and some more</section>
				<section>more stuff...</section>
			</section>
			<section>
				<h2>Linked image</h2>
				<img src="https://placekittens.com/801/501" alt="adorable kitten">
			</section>
			<section data-background="https://media.giphy.com/media/3oKIPmDhXaieiJE3Sg/giphy.gif">
				<h2>Full Screen Background</h2>
			</section>
		</div>
	</div>

	<script src="dist/reveal.js"></script>
	<script src="plugin/notes/notes.js"></script>
	<script src="plugin/markdown/markdown.js"></script>
	<script src="plugin/highlight/highlight.js"></script>
	<script>
		// More info about initialization & config:
		// - https://revealjs.com/initialization/
		// - https://revealjs.com/config/
		Reveal.initialize({
			hash: true,

			// Learn about plugins: https://revealjs.com/plugins/
			plugins: [RevealMarkdown, RevealHighlight, RevealNotes]
		});
	</script>
</body>

</html>
